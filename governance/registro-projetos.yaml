# registro-projetos.yaml — registro machine-first dos projetos da sua instância do Shizune.
# Semente do framework: comece vazio e adicione projetos com `bun scripts/new-project.mjs <slug>`.
# (No export público este arquivo é renomeado para governance/registro-projetos.yaml.)
#
# Schema (cada item da lista `projetos`):
#   slug:   identificador canônico kebab-case, único no ecossistema (chave do projeto)
#   nome:   nome de exibição do projeto
#   status: ativo | pausado | planejado | arquivado | bloqueado
#   repo:   caminho do repositório real no disco (null se ainda não existe)
#   ficha:  caminho relativo à raiz do Shizune para a ficha do projeto (null se ainda não existe)
#   nota:   observação curta e livre (opcional)

atualizado: 2026-08-27

projetos: []
