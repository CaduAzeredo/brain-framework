<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" width="100%"
     preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="bf-title bf-desc">
  <title id="bf-title">The Brain Framework skill pipeline</title>
  <desc id="bf-desc">Five skills run left to right. grill-with-docs produces CONTEXT.md; domain-modeling produces DOMAIN.md; to-spec produces a spec with acceptance criteria; implement produces a ticket and code; handoff produces handoff.md and handoff.json. Two human stops gate the flow: one before implement and one after handoff. A band running beneath every stage marks the automated validation of structure, links, frontmatter and secrets.</desc>

  <defs>
    <marker id="bf-arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#6280ad"/>
    </marker>
  </defs>

  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     fill="none" stroke-linecap="round">

    <!-- stage boxes -->
    <g stroke="#6280ad" stroke-width="1.6" fill="#6280ad" fill-opacity="0.12">
      <rect x="21" y="64" width="134" height="62" rx="10"/>
      <rect x="187" y="64" width="134" height="62" rx="10"/>
      <rect x="353" y="64" width="134" height="62" rx="10"/>
      <rect x="563" y="64" width="134" height="62" rx="10"/>
      <rect x="729" y="64" width="134" height="62" rx="10"/>
    </g>

    <!-- stage names -->
    <g fill="#6280ad" stroke="none" font-size="13" font-weight="600" text-anchor="middle">
      <text x="88" y="100">grill-with-docs</text>
      <text x="254" y="100">domain-modeling</text>
      <text x="420" y="100">to-spec</text>
      <text x="630" y="100">implement</text>
      <text x="796" y="100">handoff</text>
    </g>

    <!-- artifacts produced by each stage -->
    <g fill="#7089b0" stroke="none" font-size="11.5" text-anchor="middle">
      <text x="88" y="150">CONTEXT.md</text>
      <text x="254" y="150">DOMAIN.md</text>
      <text x="420" y="150">spec + acceptance</text>
      <text x="420" y="166">criteria</text>
      <text x="630" y="150">ticket + code</text>
      <text x="796" y="150">handoff.md + .json</text>
    </g>

    <!-- flow connectors -->
    <g stroke="#6280ad" stroke-width="1.6" marker-end="url(#bf-arrow)">
      <line x1="161" y1="95" x2="185" y2="95"/>
      <line x1="327" y1="95" x2="351" y2="95"/>
      <line x1="491" y1="95" x2="507" y2="95"/>
      <line x1="545" y1="95" x2="561" y2="95"/>
      <line x1="703" y1="95" x2="727" y2="95"/>
      <line x1="867" y1="95" x2="883" y2="95"/>
    </g>

    <!-- human stop gates -->
    <g stroke="#b07d33" stroke-width="1.6" fill="#b07d33" fill-opacity="0.16">
      <path d="M 525 79 L 541 95 L 525 111 L 509 95 Z"/>
      <path d="M 901 79 L 917 95 L 901 111 L 885 95 Z"/>
    </g>
    <g fill="#b07d33" stroke="none" fill-opacity="0.95">
      <rect x="521.6" y="89" width="2.6" height="12" rx="1"/>
      <rect x="525.8" y="89" width="2.6" height="12" rx="1"/>
      <rect x="897.6" y="89" width="2.6" height="12" rx="1"/>
      <rect x="901.8" y="89" width="2.6" height="12" rx="1"/>
    </g>
    <g stroke="#b07d33" stroke-width="1.3" stroke-dasharray="2 3" stroke-opacity="0.8">
      <line x1="525" y1="56" x2="525" y2="76"/>
      <line x1="901" y1="56" x2="901" y2="76"/>
    </g>
    <g fill="#b07d33" stroke="none" font-size="12" font-weight="600" text-anchor="middle">
      <text x="525" y="48">human stop</text>
      <text x="901" y="48">human stop</text>
    </g>

    <!-- every stage sits on the automated validation band -->
    <g stroke="#6280ad" stroke-width="1.4" stroke-opacity="0.6" stroke-dasharray="2 4">
      <line x1="88" y1="180" x2="88" y2="206"/>
      <line x1="254" y1="180" x2="254" y2="206"/>
      <line x1="420" y1="180" x2="420" y2="206"/>
      <line x1="630" y1="180" x2="630" y2="206"/>
      <line x1="796" y1="180" x2="796" y2="206"/>
    </g>

    <rect x="21" y="208" width="918" height="48" rx="12"
          fill="#6280ad" fill-opacity="0.08" stroke="#6280ad" stroke-opacity="0.55" stroke-width="1.4"/>
    <text x="480" y="237" fill="#6280ad" stroke="none" font-size="13" text-anchor="middle">
      <tspan font-weight="600">validated:</tspan><tspan dx="6">structure &#183; links &#183; frontmatter &#183; secrets</tspan>
    </text>

  </g>
</svg>
