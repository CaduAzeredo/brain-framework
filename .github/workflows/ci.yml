# Shizune — public repository checks.
# Zero dependencies: nothing is installed, the validators run on runtime builtins alone.
#
# This workflow runs `doctor`, which is the same entry point the QUICKSTART tells a new user to
# run. Two of doctor's steps only make sense in the private instance the package is exported from
# — the export dry-run and the pointer-lint negative test — and doctor itself skips them when the
# files they need are absent, reporting them as `n/a (pacote exportado)` rather than failing. An
# earlier version of this workflow ran two validators directly and excluded doctor for that
# reason; the guard removed the reason, and running the two alone shipped validators that nothing
# executed.

name: checks

on:
  push:
  pull_request:

# The checks only read the tree. Pinning this here means the workflow keeps a read-only
# token even in a repository whose default is read-and-write.
permissions:
  contents: read

jobs:
  node:
    name: validators on Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["20", "22"]
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          # Full history. The decision validator reads commit trailers and, if you declare an
          # authorship frontier, has to reach the frontier commit itself. The default shallow
          # clone cannot, and the check would be skipped with a warning instead of enforced.
          fetch-depth: 0

      - name: Set up Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Run every check
        run: node scripts/doctor.mjs

  bun:
    name: validators on Bun
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Run every check
        run: bun scripts/doctor.mjs
